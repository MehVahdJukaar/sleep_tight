
modLoader = "javafml"
loaderVersion = "${loader_version_range}"

license = "${mod_license}"
issueTrackerURL = "${mod_github}/issues"

[[mixins]]
config = "${mod_id}.mixins.json"
[[mixins]]
config = "${mod_id}-common.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "icon.png"
authors = "${mod_authors}"
credits = "${mod_credits}"
description = '''${mod_description}'''
modUrl = "${mod_homepage}"


[modproperties.sleep_tight]
    catalogueItemIcon = "sleep_tight:dreamer_essence" #catalogue icon
    configuredBackground = "minecraft:textures/block/blue_wool.png"


[[dependencies.sleep_tight]] #optional
    modId="forge" #mandatory
    mandatory=true #mandatory
    versionRange="[47.0.34,)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.sleep_tight]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20,1.21)"
    ordering="NONE"
    side="BOTH"

