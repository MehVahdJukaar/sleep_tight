modLoader = "javafml"
loaderVersion = "${loader_version_range}"

license = "${mod_license}"
issueTrackerURL = "${mod_github}/issues"

[[mixins]]
    config = "${mod_id}.mixins.json"
[[mixins]]
    config = "${mod_id}-common.mixins.json"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    logoFile = "icon.png"
    authors = "${mod_authors}"
    credits = "${mod_credits}"
    description = '''${mod_description}'''
    modUrl = "${mod_homepage}"
    itemIcon = "sleep_tight:dreamer_essence"

[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "${loader_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[${minecraft_version},${minecraft_max_version})"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "moonlight"
    mandatory = true
    referralUrl = "https://www.curseforge.com/minecraft/mc-mods/selene"
    versionRange = "[${required_moonlight_version},)"
    ordering = "NONE"
    side = "BOTH"
