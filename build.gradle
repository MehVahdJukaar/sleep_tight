import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.11-SNAPSHOT" apply false
    id "net.darkhax.curseforgegradle" version "1.1.28" apply false
    id "com.modrinth.minotaur" version "2.+"
    id "com.github.johnrengelman.shadow" version "7.1.2" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "com.github.johnrengelman.shadow"
    apply plugin: "net.darkhax.curseforgegradle"
    apply plugin: "com.modrinth.minotaur"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.layered() {
            it.officialMojangMappings {
                setNameSyntheticMembers(false)
            }
            //it.parchment("org.parchmentmc.data:parchment-${rootProject.parchment_version}")
        }

    }

    var env = System.getenv()
    var modLoader = name

    var changelogFile = rootProject.file("changelog.md")
    var changelogText = changelogFile.exists() ? changelogFile.text : ""

    if (env.MODRINTH_TOKEN) {
        modrinth {
            projectId = rootProject.modrinth_id
            uploadFile = tasks.remapJar
            gameVersions = [rootProject.minecraft_version]
            if (modLoader == "forge") {
                loaders = [modLoader, "neoforge"]
            } else {
                loaders = [modLoader]
            }

            changelog = changelogText

            if (modLoader == "fabric") {
                dependencies {
                    required.project "fabric-api"
                    required.project "moonlight"
                }
            } else {
                dependencies {
                    required.project "moonlight"
                }
            }
        }
    }

    tasks.register("curseforge", TaskPublishCurseForge) {
        group = "upload"
        description = "Uploads the jar to CurseForge"
        onlyIf { env.CURSEFORGE_TOKEN != null }

        dependsOn project.tasks.remapJar
        mustRunAfter project.tasks.build

        apiToken = env.CURSEFORGE_TOKEN ?: ""
        disableVersionDetection()

        def mainFile = upload(rootProject.project_id, project.tasks.remapJar)
        mainFile.releaseType = rootProject.release_type
        mainFile.changelog = changelogText
        mainFile.changelogType = "markdown"

        mainFile.addGameVersion rootProject.minecraft_version
        mainFile.addJavaVersion "Java ${rootProject.java_version}"
        mainFile.addEnvironment "Client", "Server"

        mainFile.addModLoader modLoader.capitalize()
        if (modLoader == "forge") {
            mainFile.addModLoader "NeoForge"
        }

        mainFile.addRequirement "selene"
        if (modLoader == "fabric") {
            mainFile.addRequirement "fabric-api"
        }
        mainFile.addOptional "heartstone"
    }

}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    archivesBaseName = rootProject.mod_id
    version = rootProject.mod_version
    group = rootProject.mod_group_id
    required_moonlight_version = rootProject.required_moonlight_version

    repositories {

        flatDir {
            dirs 'mods'
        }

        mavenCentral()

        mavenLocal()

        maven { url "https://maven.parchmentmc.org" }

        maven {
            url = "https://www.cursemaven.com"
            allowInsecureProtocol = true
        }

        maven { url = "https://registry.somethingcatchy.net/repository/maven-releases/" } // Moonlight / MehVahdJukaar mods

        maven {
            url "https://maven.firstdarkdev.xyz/snapshots"
        }
        maven { url 'https://jitpack.io' }

        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/"
        }
        maven {
            name = 'Ladysnake Mods'
            url = 'https://maven.ladysnake.org/releases'
        }
        maven {
            url = 'https://maven.neoforged.net'
        }

        maven { // Reach Entity Attributes
            url = "https://maven.jamieswhiteshirt.com/libs-release"
            content { includeGroup("com.jamieswhiteshirt") }
        }
        maven { url = "https://maven.tterrag.com/" } // Flywheel
        maven { url = "https://mvn.devos.one/snapshots/" } // Registrate, Porting Lib, Forge Tags, Milk Lib
        maven { url = "https://mvn.devos.one/releases/" }
        maven {
            name = "SmartBrainLib (SBL) Maven Repo"
            url = "https://dl.cloudsmith.io/public/tslat/sbl/maven/"
        }
        maven {
            url = "https://api.modrinth.com/maven"
        }

        maven {
            url = "https://maven.blamejared.com/"
        }
        maven { url = "https://maven.createmod.net" } // Ponder, Flywheel

        maven { url "https://maven.misterpemodder.com/libs-release/" } // ShulkerBoxTooltip
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = rootProject.java_version.toInteger()
        options.compilerArgs.addAll(["-Xmaxerrs", "2000", "-Xmaxwarns", "2000"])
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(rootProject.java_version.toInteger())
        }
        withSourcesJar()
    }
}

ext {
    replaceProperties = [
            minecraft_version         : minecraft_version,
            minecraft_min_version     : minecraft_min_version,
            minecraft_max_version     : minecraft_max_version,
            pack_format_number        : pack_format_number,

            mod_id                    : mod_id,
            mod_name                  : mod_name,
            mod_version               : mod_version,
            mod_license               : mod_license,
            mod_authors               : mod_authors,
            mod_description           : mod_description,
            mod_credits               : mod_credits,
            mod_homepage              : mod_homepage,
            mod_github                : mod_github,

            neo_version               : neo_version,
            neo_version_range         : neo_version_range,
            loader_version_range      : loader_version_range,
            required_moonlight_version: required_moonlight_version,
            moonlight_min_version     : required_moonlight_version,
            sbl_version               : sbl_version
    ]
}


task buildAndPublishAll {
    dependsOn ':clean'
    dependsOn ':build'
    dependsOn ':forge:curseforge'
    dependsOn ':forge:modrinth'
    dependsOn ':fabric:curseforge'
    dependsOn ':fabric:modrinth'
}

buildAndPublishAll.group = 'build'
buildAndPublishAll.description = 'Runs clean, build, and publish forge and fabric'

task buildAndPublishAllM {
    dependsOn buildAndPublishAll
    dependsOn ':publishToMavenLocal'
}

buildAndPublishAllM.group = 'build'
buildAndPublishAllM.description = 'Runs clean, build, publish forge and fabric and uploads to maven local'
